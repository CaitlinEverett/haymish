# Haymish rules
# ================
# Lives at ~/.haymish/rules.toml (run `haymish init` to install this template).
#
# Each [rule.<name>] declares a query, an optional classifier, and a disposition.
# The starter rules only add albums/keywords: a new install must earn trust before
# it changes visibility or stages cleanup. Optional lifecycle stages are age-gated
# by the PHOTO'S OWN DATE (not when it was first matched).
#
#   file    = { album = "...", keyword = "..." }  # immediate: filed, still visible
#   hide    = { after_days = N }                  # off the camera roll (Photos Hidden album)
#   archive = { after_days = N }                  # export to [global].backup (manifest work in progress)
#   delete  = { after_days = N }                  # STAGED ONLY — final deletion currently fails
#                                                 # closed until complete asset-component manifests
#                                                 # exist; it will also require typed + macOS approval.
#
# Rules run in file order. `exclude_matched_by` keeps a photo claimed by an earlier
# rule from being re-processed by a later one.

[global]
# library = "~/Pictures/Photos Library.photoslibrary"  # default: system library
# backup = "/Volumes/PhotoVault/haymish"            # REQUIRED before archive/delete stages run
report_dir = "~/.haymish/reports"

[global.ollama]
host = "http://localhost:11434"
model = "gemma3:4b"           # vision-capable and fast; any multimodal Ollama model works

[global.claude]
model = "claude-sonnet-5"     # used only by rules with backend = "claude"; needs ANTHROPIC_API_KEY

[global.ai]
# The AI index behind `haymish index` / `find` / `ask` and semantic rules.
# All local via Ollama by default; nothing leaves this Mac.
embed_model = "qwen3-embedding:8b"    # text embeddings for semantic search
# vision_model = "gemma3:4b"          # captions; defaults to [global.ollama].model
planner_model = "qwen3.6:27b"         # turns `haymish ask "..."` into a rule
# planner_backend = "claude"          # opt-in: use the Claude API for planning instead

# ---------------------------------------------------------------------------
# 1. Ad/product screenshots — the core roll-clutter candidate. The starter
#    posture only annotates and adds an album view; visibility remains unchanged.
[rule.ad-screenshots]
query = { screenshot = true }
classify = { backend = "ollama", prompt = "Is this a screenshot of a product advertisement, shopping page, listing, or item for sale? Answer only yes or no.", threshold = 0.7 }
file = { album = "Swept/Ads & Products", keyword = "swept:ad" }

# 2. Receipts — heuristics on Apple's labels + indexed OCR text. Runs BEFORE
#    screenshots-general so its exclude_matched_by actually has something to exclude
#    (exclude_matched_by only sees rules that already ran this sweep, earlier in file order).
[rule.receipts]
query = {}
detector = "receipts"
file = { album = "Swept/Receipts", keyword = "swept:receipt" }

# 3. Message screenshots — chat-layout heuristics on OCR text. Same ordering reason as above.
[rule.message-screenshots]
query = { screenshot = true }
detector = "messages"
file = { album = "Swept/Messages", keyword = "swept:message" }

# 4. All other screenshots — annotated and added to an album view.
[rule.screenshots-general]
query = { screenshot = true }
exclude_matched_by = ["ad-screenshots", "receipts", "message-screenshots"]
file = { album = "Swept/Screenshots", keyword = "swept:screenshot" }

# 5. Selfies — an optional album view; nothing is hidden by default.
[rule.selfies]
query = { selfie = true }
file = { album = "Swept/Selfies" }

# 6. Duplicates — keeps the best copy (resolution, then aesthetic score),
#    stages the rest. Report-reviewed before any delete, like everything else.
[rule.dupes]
detector = "dupes"
file = { album = "Swept/Duplicates" }

# 7. Junk candidates (blurry, failed, noisy shots) — report-only by default.
#    Calibrate thresholds from the scan report before enabling actions.
[rule.junk]
detector = "junk"
report_only = true

# 8. Screen recordings — added to an album view. Videos work in rules via
#    `movie` / `screen_recording` query flags; the AI index covers them too
#    (captioned from their poster frame).
[rule.screen-recordings]
query = { screen_recording = true }
file = { album = "Swept/Screen Recordings" }

# ---------------------------------------------------------------------------
# QUERY REFERENCE — every filter below reads metadata Photos already has, so
# it's free compared to semantic/classify. Narrow with query first, then let the
# expensive stages work on what's left.
#
#   kind      screenshot, selfie, favorite, hidden, movie, screen_recording,
#             raw, burst, live_photo                       (all true/false)
#   time      min_age_days / max_age_days   (relative — drifts each run)
#             after / before                (fixed dates; `before` is EXCLUSIVE,
#                                            so before = 2026-06-16 includes the 15th)
#   place     place = "Chicago"             (substring of the place name)
#             near = { lat = 41.88, lon = -87.63, km = 25 }
#             has_location = true
#   people    persons = ["Alice"]           (any of), has_faces = true
#   quality   min_score = 0.7               (Apple's overall curation score)
#             max_failure = 0.2             (Apple's failed-shot score; low is good)
#             min_rating = 3                (0-5 stars)
#   capture   camera = "iPhone 15 Pro", lens = "35mm"   (substrings)
#   organize  albums, exclude_albums, keywords           (lists)
#
# Example — a trip gallery, no AI needed:
# [rule.chicago-march]
# query = { after = 2026-03-01, before = 2026-03-08, near = { lat = 41.88, lon = -87.63, km = 40 } }
# file = { album = "Trips/Chicago March" }
#
# Example — cull a shoot by Apple's own quality scores:
# [rule.wedding-picks]
# query = { after = 2026-06-14, before = 2026-06-16, min_score = 0.7, max_failure = 0.2 }
# file = { keyword = "pick" }

# ---------------------------------------------------------------------------
# Semantic rules: match by CONTENT using the AI index (`haymish index` first).
# `semantic.query` is a plain-language description; min_score tunes strictness.
# Tip: prototype these conversationally — `haymish ask "file my recipe
# screenshots into Recipes" --save recipes` writes the rule here for you.
#
# [rule.recipes]
# query = { screenshot = true }
# semantic = { query = "screenshot of a cooking recipe with ingredients or instructions", min_score = 0.35 }
# file = { album = "Recipes" }
